name: Release

# 推送 v* 标签时把 CLI 发布到 npm，并创建 GitHub Release。
# 带“-”的版本（例如 v0.2.0-rc.1）发布到 npm 的 next 标签并标为预发布，用户安装和 pi-bridge update 只会拿到正式版。
# 发布到 npm 使用受信发布（OIDC），需要在 npm 包设置里把本仓库的 release.yml 设为受信发布者，不需要令牌。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 核对版本号
        run: |
          WANT="${GITHUB_REF_NAME#v}"
          for f in packages/cli/package.json packages/server/package.json; do
            HAVE="$(jq -r .version "$f")"
            if [ "$HAVE" != "$WANT" ]; then
              echo "::error::$f 的版本号是 $HAVE，与标签 $GITHUB_REF_NAME 不一致。请先改成 $WANT 并合并到 main，再重新打标签。"
              exit 1
            fi
          done
      - uses: jdx/mise-action@v5
      - run: mise run install
      - run: mise run check
      - run: mise run test
      - run: mise run build-cli
      - name: 发布到 npm
        run: |
          TAG=latest
          case "$GITHUB_REF_NAME" in *-*) TAG=next ;; esac
          npm publish packages/cli/dist/package --access public --tag "$TAG"
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "pi-bridge $VERSION" --generate-notes $FLAGS
